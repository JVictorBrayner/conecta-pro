<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Publicação - ConectaPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#F9F5D7] min-h-screen pb-12">

    {% include 'navbar.html' %}

    <main class="max-w-2xl mx-auto px-4 mt-8">
        <div class="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden">
            
            <div class="bg-[#022E4B] p-6 text-white">
                <h1 class="text-xl font-bold">Editar Publicação</h1>
                <p class="text-xs text-[#F0FFF3] opacity-90 mt-1">
                    Atualize a descrição ou substitua a foto do seu serviço.
                </p>
            </div>

            <div class="p-6">
                {% if erro %}
                    <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-3 mb-4 rounded-r-lg text-sm font-semibold">
                        {{ erro }}
                    </div>
                {% endif %}

                <form action="{% url 'editar_publicacao' publicacao.id %}" method="POST" enctype="multipart/form-data" class="space-y-5">
                    {% csrf_token %}

                    <div>
                        <label for="texto" class="block text-sm font-semibold text-[#022E4B] mb-1">Descrição do Serviço *</label>
                        <textarea id="texto" name="texto" rows="4"
                                  class="w-full p-3 rounded-xl border border-gray-300 bg-[#F0FFF3] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#386490] text-gray-700 text-sm">{{ publicacao.texto }}</textarea>
                    </div>

                    {% if publicacao.imagem %}
                        <div>
                            <span class="block text-xs font-semibold text-gray-500 mb-2">Imagem atual:</span>
                            <img src="{{ publicacao.imagem.url }}" alt="Imagem atual" class="w-full max-h-64 object-cover rounded-xl border border-gray-200">
                        </div>
                    {% endif %}

                    <div>
                        <label for="imagem" class="block text-sm font-semibold text-[#022E4B] mb-1">
                            {% if publicacao.imagem %}Substituir foto (opcional){% else %}Adicionar foto (opcional){% endif %}
                        </label>
                        <input type="file" id="imagem" name="imagem" accept="image/*"
                               class="w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-[#F0FFF3] file:text-[#022E4B] hover:file:bg-gray-200">
                    </div>

                    <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                        <a href="{% url 'feed' %}" class="text-sm font-semibold text-gray-500 hover:text-[#022E4B]">
                            ← Cancelar
                        </a>
                        <button type="submit" class="bg-[#386490] text-white font-bold px-6 py-2.5 rounded-lg hover:bg-[#022E4B] transition-colors shadow-sm text-sm">
                            Salvar Alterações
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
