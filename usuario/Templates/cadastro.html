<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Pro - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Crie sua conta</h2>

                    <!-- mensagens de status -->
                    {% if status == '0' %}
                        <div class="alert alert-danger">Por favor, preencha todos os campos!</div>
                    {% elif status == '1' %}
                        <div class="alert alert-success">Cadastro realizado com sucesso! Faça seu login.</div>
                    {% elif status == '2' %}
                        <div class="alert alert-warning">Este email já está cadastrado.</div>
                    {% endif %}

                    <!-- Formulário de Cadastro -->
                    <form action="{% url 'cadastro' %}" method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome completo">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com">
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite a senha">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">Cadastrar</button>
                    </form>
                    <div class="text-center mt -3">
                        <p>Já possuo uma conta <a href="{% url 'login' %}" class="text-decoration-none"> Faça login aqui </a> </p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
