<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ConectaPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Entrar na sua Conta</h2>

                    {% if status == 'erro' %}
                        <div class="alert alert-danger">Email ou senha incorretos!</div>
                    {% endif %}

                    <form action="{% url 'login' %}" method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com">
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha">
                        </div>

                        <button type="submit" class="btn btn-success w-100 mb-3">Entrar</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p>Ainda não tem conta? <a href="{% url 'cadastro' %}" class="text-decoration-none">Cadastre-se aqui</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
