<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ConectaPro</title>
    
    <!-- Script do Tailwind CSS (Substituindo o Bootstrap) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonte padrão para ficar igual ao React -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#F9F5D7] min-h-screen flex items-center justify-center p-4">

    <div class="flex w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden min-h-[500px]">
        
        <div class="hidden md:flex flex-col justify-center p-12 bg-[#022E4B] text-white w-1/2">
            <h1 class="text-4xl font-bold mb-4">
                Conecta<span class="text-[#9C5B25]">Pro</span>
            </h1>
            <p class="text-lg text-[#F0FFF3] opacity-90">
                A plataforma para conectar quem precisa com quem sabe fazer.
            </p>
        </div>

        <div class="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center overflow-hidden">
            
            <div class="flex flex-col w-full">
                <h2 class="text-3xl font-bold text-[#022E4B] mb-2">Bem-vindo de volta</h2>
                <p class="text-[#386490] mb-8">Insira os seus dados para acessar à plataforma.</p>

                {% if status == 'erro' %}
                    <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-r-lg" role="alert">
                        <p class="font-bold">Aviso</p>
                        <p>Email ou senha incorretos!</p>
                    </div>
                {% endif %}

                <form action="{% url 'login' %}" method="POST" class="space-y-4 flex-col flex">
                    {% csrf_token %}
                    
                    <div>
                        <label for="email" class="block text-sm font-semibold text-[#022E4B] mb-1">Email</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#386490] bg-[#F0FFF3]">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="senha" class="block text-sm font-semibold text-[#022E4B]">Senha</label>
                            <a href="#" class="text-sm text-[#386490] hover:underline">Esqueceu a senha?</a>
                        </div>
                        <input type="password" id="senha" name="senha" placeholder="••••••••" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#386490] bg-[#F0FFF3]">
                    </div>

                    <button type="submit" class="w-full bg-[#386490] text-white font-bold py-3 rounded-lg hover:bg-[#022E4B] transition-colors mt-4">
                        Entrar
                    </button>
                </form>
            </div>
            <div class="mt-6 text-center text-sm text-gray-600">
                Ainda não tem uma conta? 
                <a href="{% url 'cadastro' %}" class="text-[#9C5B25] font-bold hover:underline ml-1">
                    Cadastre-se 
                </a>
            </div>

        </div>
    </div>

</body>
</html>
